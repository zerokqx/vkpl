[workspace]
members = ["crates/vk-music-core", "crates/vk-music", "crates/vkpl"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
futures-util = "0.3"
url = "2"

[profile.release]
lto = "thin"
strip = true
